<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silme Taleplerim - Dijital Arınma Sistemi</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-wrapper" style="margin-bottom: 0; cursor: pointer;" onclick="window.location.href='dashboard.html'">
                <span class="logo-icon" style="font-size: 1.8rem;">🛡️</span>
                <span class="logo-text" style="font-size: 1.3rem;">Dijital Arınma</span>
            </div>
            
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="dashboard.html" class="btn btn-secondary" style="padding: 0.5rem 1rem;">◀ Paneli Dön</a>
                <div class="user-profile">
                    <span id="user-display-name" class="user-name">Yükleniyor...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-header" style="margin-bottom: 1.5rem;">
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Taleplerimi Takip Et</h1>
                <p style="color: var(--text-secondary);">Platformlara iletilen kişisel veri silme isteklerinizi yönetin ve yasal 30 günlük süreleri izleyin.</p>
            </div>
        </div>

        <!-- Tabs Container -->
        <div class="tabs-container">
            <div id="tab-pending" class="tab active" onclick="setTab('pending')">Bekleyen</div>
            <div id="tab-sent" class="tab" onclick="setTab('sent')">Gönderilen</div>
            <div id="tab-completed" class="tab" onclick="setTab('completed')">Tamamlanan</div>
            <div id="tab-rejected" class="tab" onclick="setTab('rejected')">Reddedilen</div>
        </div>

        <!-- Requests Content list -->
        <div id="requests-list-container">
            <div class="spinner-wrapper">
                <div class="spinner"></div>
                <div class="loading-text">Talepleriniz yükleniyor...</div>
            </div>
        </div>
    </main>

    <!-- Reusable Modal overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title" class="modal-title">Başlık</h3>
                <span class="modal-close" onclick="hideModal()">&times;</span>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Content -->
            </div>
            <div id="modal-footer" class="modal-footer">
                <!-- Buttons -->
            </div>
        </div>
    </div>

    <script src="assets/app.js"></script>
    <script>
        let requestsData = [];
        let currentTab = 'pending'; // pending, sent, completed, rejected

        document.addEventListener("DOMContentLoaded", async () => {
            if (!getToken()) {
                window.location.href = "index.html";
                return;
            }
            await fetchUserProfile();
            await fetchRequests();
        });

        async function fetchUserProfile() {
            try {
                const user = await apiCall("/api/auth/me");
                if (user) {
                    document.getElementById("user-display-name").innerText = user.display_name;
                }
            } catch (e) {
                console.error("Failed to load user info");
            }
        }

        async function fetchRequests() {
            try {
                const requests = await apiCall("/api/requests/");
                requestsData = requests || [];
                renderRequests();
            } catch (e) {
                showToast("Talepler alınırken hata oluştu.", "danger");
            }
        }

        function setTab(tabName) {
            currentTab = tabName;
            
            // Adjust active tab state
            document.querySelectorAll(".tab").forEach(tab => {
                tab.classList.remove("active");
            });
            document.getElementById(`tab-${tabName}`).classList.add("active");
            
            renderRequests();
        }

        function renderRequests() {
            const container = document.getElementById("requests-list-container");
            if (!container) return;
            
            // Filter requests
            const filtered = requestsData.filter(req => {
                // If pending tab, include "pending"
                // If sent tab, include "sent" or "acknowledged"
                if (currentTab === 'pending') return req.status === 'pending';
                if (currentTab === 'sent') return req.status === 'sent' || req.status === 'acknowledged';
                return req.status === currentTab;
            });
            
            if (filtered.length === 0) {
                let tabExplain = "";
                if (currentTab === "pending") tabExplain = "Henüz şablonu hazırlanan ancak gönderilmemiş talep bulunmuyor.";
                if (currentTab === "sent") tabExplain = "E-posta ile gönderilip yanıt bekleyen talep bulunmuyor.";
                if (currentTab === "completed") tabExplain = "Veri silme talebi başarıyla onaylanan platform bulunmuyor.";
                if (currentTab === "rejected") tabExplain = "Reddedilen silme talebi bulunmuyor.";
                
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⏳</div>
                        <h3>Talep Bulunmuyor</h3>
                        <p style="margin-top: 0.5rem;">${tabExplain}</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="accounts-grid">';
            
            filtered.forEach(req => {
                const daysLeft = getDaysLeft(req.deadline);
                let deadlineHtml = "";
                
                if (req.status === 'sent' || req.status === 'acknowledged') {
                    if (daysLeft !== null) {
                        const isRed = daysLeft <= 7 ? 'deadline-red' : '';
                        deadlineHtml = `
                            <div class="detail-row">
                                <span class="detail-label">Kalan Süre (Yasal):</span>
                                <span class="detail-value ${isRed}">${daysLeft} gün kaldı</span>
                            </div>
                        `;
                    }
                }
                
                const statusLabels = {
                    "pending": "Bekliyor",
                    "sent": "Gönderildi",
                    "acknowledged": "Yanıtlandı",
                    "completed": "Silindi",
                    "rejected": "Reddedildi",
                    "expired": "Zaman Aşımı"
                };
                
                let actionButtonsHtml = "";
                if (req.status === 'pending') {
                    actionButtonsHtml = `
                        <button class="btn btn-primary" onclick="openSendEmailModal('${req.id}')" style="font-size:0.8rem; width:100%;">Talebi Gönder</button>
                    `;
                } else if (req.status === 'sent' || req.status === 'acknowledged') {
                    actionButtonsHtml = `
                        <div style="display:flex; gap:0.5rem; width:100%; margin-top:0.5rem;">
                            <button class="btn btn-primary" onclick="updateStatus('${req.id}', 'completed')" style="font-size:0.75rem; flex:1; padding:0.5rem;">✔️ Tamamlandı</button>
                            <button class="btn btn-danger" onclick="updateStatus('${req.id}', 'rejected')" style="font-size:0.75rem; flex:1; padding:0.5rem;">❌ Reddedildi</button>
                        </div>
                    `;
                }
                
                html += `
                    <div class="account-card" style="min-height: 280px;">
                        <div class="account-top">
                            <div class="account-info-main">
                                <div class="platform-logo">${req.platform_name.charAt(0)}</div>
                                <div>
                                    <div class="platform-name">${req.platform_name}</div>
                                    <span class="category-badge category-${req.platform_category}">${req.platform_domain}</span>
                                </div>
                            </div>
                            <span class="badge badge-${req.status}">${statusLabels[req.status]}</span>
                        </div>
                        
                        <div class="account-details" style="margin-bottom:1rem;">
                            <div class="detail-row">
                                <span class="detail-label">Oluşturma Tarihi:</span>
                                <span class="detail-value">${formatDate(req.created_at)}</span>
                            </div>
                            ${req.sent_at ? `
                            <div class="detail-row">
                                <span class="detail-label">Gönderilme Tarihi:</span>
                                <span class="detail-value">${formatDate(req.sent_at)}</span>
                            </div>` : ''}
                            ${req.deadline ? `
                            <div class="detail-row">
                                <span class="detail-label">Son Cevap Tarihi:</span>
                                <span class="detail-value">${formatDate(req.deadline)}</span>
                            </div>` : ''}
                            ${deadlineHtml}
                            ${req.notes ? `
                            <div class="detail-row" style="margin-top: 0.5rem; flex-direction: column; align-items: flex-start; gap: 0.2rem;">
                                <span class="detail-label">Notlar:</span>
                                <span class="detail-value" style="color: var(--text-muted); font-size: 0.8rem;">${req.notes}</span>
                            </div>` : ''}
                        </div>
                        
                        <div class="account-actions" style="flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: auto;">
                            <button class="btn btn-secondary" onclick="viewEmailTemplate('${req.id}', '${req.platform_name}')" style="font-size:0.8rem; width:100%;">📄 E-posta Şablonunu Gör</button>
                            ${actionButtonsHtml}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        async function viewEmailTemplate(requestId, platformName) {
            try {
                const req = await apiCall(`/api/requests/${requestId}/email`);
                
                const bodyHtml = `
                    <div class="modal-field">
                        <label class="modal-label">Alıcı DPO E-posta Adresi:</label>
                        <input type="email" class="modal-input" readonly value="${req.dpo_email}">
                    </div>
                    <div class="modal-field">
                        <label class="modal-label">KVKK E-posta İçeriği:</label>
                        <textarea class="modal-textarea" readonly style="height:320px;">${req.subject}\n\n${req.body}</textarea>
                    </div>
                `;
                
                const footerHtml = `
                    <button class="btn btn-primary" onclick="hideModal()">Kapat</button>
                `;
                
                showModal(`${platformName} Talep Detayı`, bodyHtml, footerHtml);
            } catch (e) {
                showToast("Şablon yüklenirken hata oluştu.", "danger");
            }
        }

        async function openSendEmailModal(requestId) {
            try {
                const req = await apiCall(`/api/requests/${requestId}/email`);
                
                const bodyHtml = `
                    <div class="modal-field">
                        <label class="modal-label">Alıcı DPO E-posta Adresi:</label>
                        <input id="modal-dpo-email" type="email" class="modal-input" value="${req.dpo_email}">
                    </div>
                    <div class="modal-field">
                        <label class="modal-label">KVKK E-posta İçeriği:</label>
                        <textarea id="modal-email-body" class="modal-textarea" style="height:260px;">${req.subject}\n\n${req.body}</textarea>
                    </div>
                `;
                
                const footerHtml = `
                    <div style="display: flex; flex-direction: column; gap: 0.75rem; width: 100%;">
                        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap;">
                            <button class="btn btn-secondary" onclick="hideModal()">Vazgeç</button>
                            <button class="btn btn-secondary" onclick="copyRequestText()">📋 Metni Kopyala</button>
                            <button class="btn btn-primary" id="send-email-btn" onclick="sendViaGmail('${requestId}')">✉️ Gmail API ile Gönder (Arka Planda)</button>
                        </div>
                        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
                            <button class="btn btn-secondary" onclick="openInEmailClient('${requestId}')" style="background: rgba(99, 102, 241, 0.1); color: var(--accent); border-color: rgba(99, 102, 241, 0.3);">
                                ✉️ E-posta İstemcisiyle Aç (Outlook/Mail)
                            </button>
                            <button class="btn btn-secondary" onclick="openInGmailWeb('${requestId}')" style="background: rgba(234, 67, 53, 0.1); color: #ea4335; border-color: rgba(234, 67, 53, 0.3);">
                                🌐 Gmail Web Sayfasında Aç
                            </button>
                        </div>
                    </div>
                `;
                
                showModal("Silme Talebini Gönder", bodyHtml, footerHtml);
            } catch (e) {
                showToast("Şablon yüklenirken hata oluştu.", "danger");
            }
        }

        function copyRequestText() {
            const bodyTextarea = document.getElementById("modal-email-body");
            if (bodyTextarea) {
                bodyTextarea.select();
                document.execCommand("copy");
                showToast("E-posta şablonu panoya kopyalandı!");
            }
        }

        async function openInEmailClient(requestId) {
            const dpoEmail = document.getElementById("modal-dpo-email").value.trim();
            const fullText = document.getElementById("modal-email-body").value.trim();
            
            if (!dpoEmail) {
                showToast("Lütfen alıcı e-posta adresini girin.", "danger");
                return;
            }
            
            const parts = fullText.split("\n\n");
            const subject = parts[0] || "";
            const body = parts.slice(1).join("\n\n") || "";
            
            const mailtoUrl = `mailto:${encodeURIComponent(dpoEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoUrl;
            
            try {
                await apiCall(`/api/requests/${requestId}/status`, "PUT", { status: "sent" });
                showToast("Talep durumu 'Gönderildi' olarak güncellendi.", "success");
                setTimeout(async () => {
                    hideModal();
                    await fetchRequests();
                }, 1500);
            } catch (e) {
                console.error("Durum güncellenirken hata:", e);
            }
        }

        async function openInGmailWeb(requestId) {
            const dpoEmail = document.getElementById("modal-dpo-email").value.trim();
            const fullText = document.getElementById("modal-email-body").value.trim();
            
            if (!dpoEmail) {
                showToast("Lütfen alıcı e-posta adresini girin.", "danger");
                return;
            }
            
            const parts = fullText.split("\n\n");
            const subject = parts[0] || "";
            const body = parts.slice(1).join("\n\n") || "";
            
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(dpoEmail)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, "_blank");
            
            try {
                await apiCall(`/api/requests/${requestId}/status`, "PUT", { status: "sent" });
                showToast("Talep durumu 'Gönderildi' olarak güncellendi.", "success");
                setTimeout(async () => {
                    hideModal();
                    await fetchRequests();
                }, 1500);
            } catch (e) {
                console.error("Durum güncellenirken hata:", e);
            }
        }

        async function sendViaGmail(requestId) {
            const dpoEmail = document.getElementById("modal-dpo-email").value.trim();
            const fullText = document.getElementById("modal-email-body").value.trim();

            if (!dpoEmail) {
                showToast("Lütfen alıcı e-posta adresini girin.", "danger");
                return;
            }

            const parts = fullText.split("\n\n");
            const subject = parts[0];
            const body = parts.slice(1).join("\n\n");

            const btn = document.getElementById("send-email-btn");
            if (btn) { btn.disabled = true; btn.textContent = "Gönderiliyor..."; }

            try {
                await apiCall(`/api/requests/${requestId}/send`, "POST", {
                    dpo_email: dpoEmail,
                    subject: subject,
                    body: body
                });
                showToast("✅ E-posta Gmail üzerinden başarıyla gönderildi!", "success");
                hideModal();
                await fetchRequests();
            } catch (e) {
                const msg = e?.detail || "E-posta gönderilemedi. Lütfen tekrar giriş yapın.";
                showToast(msg, "danger");
                if (btn) { btn.disabled = false; btn.textContent = "✉️ Gmail ile Gönder"; }
            }
        }

        async function updateStatus(requestId, newStatus) {
            const confirmMsg = newStatus === 'completed' 
                ? "Bu platformdaki verilerinizin tamamen silindiğini ve talebin başarıyla kapandığını onaylıyor musunuz?"
                : "Bu talebin reddedildiğini veya yasal sürenin olumsuz sonuçlandığını onaylıyor musunuz?";
                
            if (confirm(confirmMsg)) {
                try {
                    await apiCall(`/api/requests/${requestId}/status`, "PUT", {
                        status: newStatus
                    });
                    showToast("Talep durumu başarıyla güncellendi!");
                    await fetchRequests();
                } catch (e) {
                    showToast("Talep durumu güncellenirken hata oluştu.", "danger");
                }
            }
        }
    </script>
</body>
</html>
